<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쓰담쓰담 멍멍</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one full-bleed 3D stage (cozy room diorama, dog on a round bed), a soft status card on it, round swatch + icon controls underneath */
:root{
  --bg:#f8f3ec; --surface:#fffdf9; --chip:#efe7dc; --ink:#2f2a24; --muted:#7a7064; --line:#e6ddd0;
  --accent:#3b3128; --accent-ink:#fffaf3; --mood:#d7894a; --clean:#5d9fbe;
  --hud:rgba(255,251,245,.78); --hud-ink:#2f2a24;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140f; --surface:#211d17; --chip:#2b261f; --ink:#efe8dd; --muted:#a89d8f; --line:#332d25;
    --accent:#efe3d1; --accent-ink:#1d1812; --mood:#e9a46a; --clean:#86c3de;
    --hud:rgba(28,24,19,.72); --hud-ink:#f3ebdf; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17140f; --surface:#211d17; --chip:#2b261f; --ink:#efe8dd; --muted:#a89d8f; --line:#332d25;
  --accent:#efe3d1; --accent-ink:#1d1812; --mood:#e9a46a; --clean:#86c3de;
  --hud:rgba(28,24,19,.72); --hud-ink:#f3ebdf; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
h1{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.stage{position:relative;border-radius:22px;overflow:hidden;background:#eadfce;box-shadow:0 1px 0 var(--line)}
.stage:fullscreen{border-radius:0;display:flex;align-items:center;justify-content:center;background:#000}
.stage:fullscreen canvas{width:min(100vw,142.857vh);}
canvas{display:block;width:100%;max-width:100%;height:auto;aspect-ratio:10/7;touch-action:none;cursor:none}
.hud{position:absolute;left:14px;top:14px;width:min(330px,44%);background:var(--hud);color:var(--hud-ink);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px;padding:10px 14px 12px;display:grid;gap:8px;pointer-events:none}
#msg{font-family:var(--display);font-size:17px;line-height:1.35;margin:0;min-height:2.7em;display:flex;align-items:center}
.meters{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:12px}
.meters .k{color:inherit;opacity:.7;letter-spacing:.06em}
.meters .v{font-variant-numeric:tabular-nums;text-align:right;min-width:3.2em}
.bar{height:6px;border-radius:999px;background:rgba(127,110,90,.22);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:999px;transition:width .2s linear}
#moodBar{background:var(--mood)} #cleanBar{background:var(--clean)}
.corner{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.round{width:46px;height:46px;border-radius:50%;border:none;background:var(--hud);color:var(--hud-ink);display:grid;place-items:center;cursor:pointer;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:0}
.round svg,.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(40,30,20,.6);color:#fff8ee;
  padding:6px 14px;border-radius:999px;font-size:14px;pointer-events:none;transition:opacity .5s;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.hint.gone{opacity:0}
.bar-row{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.swatches,.icons{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.swatch{width:52px;height:52px;border-radius:50%;border:none;padding:0;cursor:pointer;background:var(--chip) center/cover no-repeat;position:relative;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.swatch[aria-pressed="true"]::after{content:"";position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 2px var(--bg);-webkit-mask:none}
.icon{width:46px;height:46px;border-radius:50%;border:none;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.icon:hover{background:var(--chip)}
.icon[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sep{width:1px;height:28px;background:var(--line)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.foot{display:flex;justify-content:flex-end}
.text-btn{font:inherit;font-size:14px;color:var(--ink);background:var(--chip);border:none;border-radius:999px;padding:7px 14px;cursor:pointer}
@media (max-width:640px){
  .hud{position:static;width:auto;border-radius:0;background:var(--surface);color:var(--ink);-webkit-backdrop-filter:none;backdrop-filter:none}
  .stage{display:flex;flex-direction:column-reverse}
  .swatch{width:44px;height:44px}
}
</style>

<div class="wrap">
  <h1>쓰담쓰담 멍멍</h1>
  <section class="stage" id="stage" aria-label="강아지 돌보기">
    <canvas id="scene" role="img" aria-label="아늑한 방 안 방석 위에 엎드린 3D 강아지. 고른 도구로 누른 채 문지르면 쓰다듬거나 씻길 수 있습니다."></canvas>
    <div class="hud" aria-live="polite">
      <p id="msg">강아지를 데려오는 중이에요…</p>
      <div class="meters">
        <span class="k">기분</span><div class="bar"><i id="moodBar"></i></div><span class="v" id="moodVal">시큰둥</span>
        <span class="k">청결</span><div class="bar"><i id="cleanBar"></i></div><span class="v" id="cleanVal">0%</span>
      </div>
    </div>
    <div class="corner"><button class="round" id="lightToggle" aria-label="밤으로 바꾸기" title="낮과 밤"></button></div>
    <div class="hint" id="hint">아래에서 도구를 고르고, 누른 채로 문질러 보세요</div>
  </section>

  <div class="bar-row">
    <div class="swatches" id="breeds" role="group" aria-label="견종"></div>
    <div class="icons" role="group" aria-label="도구와 설정">
      <button class="icon" data-tool="hand" aria-label="손으로 쓰다듬기" title="손" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-.5V4a1.5 1.5 0 0 1 3 0v7m0-.5V5.5a1.5 1.5 0 0 1 3 0V14c0 4-2.6 7-6.4 7-2.7 0-4.4-1.6-5.4-3.8l-1.6-3.6a1.5 1.5 0 0 1 2.6-1.4L8 14"/></svg></button>
      <button class="icon" data-tool="scratch" aria-label="효자손으로 긁어 주기" title="효자손" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 21 15 10"/><path d="M13.5 8.5c1-2 3-3.5 5.5-3.5M15 10c1.5-.6 3.2-.5 5 .6M14 9l3.2-4.6M14.6 9.6l4.6-2.2"/></svg></button>
      <button class="icon" data-tool="foam" aria-label="거품 묻히기" title="거품" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="8.5" cy="14.5" r="4.5"/><circle cx="16" cy="8" r="3"/><circle cx="17.5" cy="16.5" r="2"/><path d="M6.8 12.8a2 2 0 0 1 1.7-1"/></svg></button>
      <button class="icon" data-tool="shower" aria-label="샤워기로 헹구기" title="샤워기" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20c0-6 3-9 7-10"/><path d="M9 7.5a6 6 0 0 1 8.5 8.5z"/><path d="M15 17.5l1 2M18 15l2 1M17.3 17.3l1.5 1.5"/></svg></button>
      <button class="icon" data-tool="towel" aria-label="수건으로 말리기" title="수건" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M4 9.5h16M4 14.5h16"/></svg></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="icon" id="sound" aria-label="소리 켜기" title="소리" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5M18 7a7 7 0 0 1 0 10"/></svg></button>
      <button class="icon" id="full" aria-label="전체 화면" title="전체 화면"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div class="foot">
    <button class="text-btn" id="walk">다시 산책 가기</button>
  </div>
</div>

<script>
setTimeout(()=>{if(!window.__dogReady){const m=document.getElementById('msg');if(m)m.textContent='3D 그림을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'}},12000);
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">

  chihuahua:{name:'치와와',subj:'치와와가',s:.68,base:'#ddb07a',mark:'#f4dcb8',eye:'#1d1512',len:.9,w:.9,leg:.95,head:1.28,mz:.42,mzw:.9,fluff:.92,eyeSize:1.45,
    ears:{kind:'erect',size:1.75,splay:1.4},tail:{type:'floor',len:.95,plume:.2,curl:1.2,thin:.6},marks:['muzzle','chest'],collar:'#9a6ad6',inner:'#f1b9aa',fav:'side',fur:0.016,furDen:150},
};
const ZONES={head:'머리',cheeks:'볼',muzzle:'주둥이',ears:'귀',neck:'목덜미',back:'등',side:'옆구리',rump:'엉덩이',paws:'앞발',tail:'꼬리'};
const RADIUS={hand:.16,scratch:.12,foam:.15,shower:.24,towel:.2};

// ---------- 렌더러 ----------
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'})}
catch(e){msgEl.textContent='이 브라우저에서는 3D 그림을 그릴 수 없어요.';throw e}

renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));

const camera=new THREE.PerspectiveCamera(30,10/7,.1,60);
const CAM_POS=V3(1.95,2.95,5.4),CAM_AT=V3(-.35,.48,-.3);
camera.position.copy(CAM_POS);camera.lookAt(CAM_AT);

// ---------- 털 재질: 표면(바탕) + 털끝 껍질(shell) 여러 겹, 흙/거품/물기는 꼭짓점마다 칠함 ----------
const MAXC=256,SHELLS=10;

const NOISE=`
float h3(vec3 p){return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}

  vec3 r=vec3(h3(c),h3(c+7.13),h3(c+3.71))*.6+.2;
  return layer>.45+.55*h3(c+1.9)?9.:length(f-r);}`;
function furMat(hex,layer=0){
  const c=new THREE.Color(hex),shell=layer>0;
  const m=shell?new THREE.MeshStandardMaterial({color:c,roughness:.82})
    :new THREE.MeshPhysicalMaterial({color:c,roughness:.9,sheen:1,sheenRoughness:.42,sheenColor:c.clone().lerp(new THREE.Color('#ffffff'),.5)});
  if(shell)m.defines={FUR_SHELL:''};
  m.userData.hex=hex;
  m.onBeforeCompile=sh=>{
    Object.assign(sh.uniforms,FU);sh.uniforms.layer={value:layer};
    sh.vertexShader=`attribute vec3 restPos;attribute vec4 aState;
uniform float layer;uniform float furLen;
varying vec4 vState;varying vec3 vRest;
`+sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
vRest=restPos;vState=aState;`).replace('#include <project_vertex>',`#include <project_vertex>
#ifdef FUR_SHELL
{float wt=clamp(aState.z,0.,1.);float L=furLen*(1.-wt*.55)*layer;
vec3 g=(viewMatrix*vec4(0.,-1.,0.,0.)).xyz;
mvPosition.xyz+=normalize(transformedNormal)*L+g*L*layer*.4;

#endif`);

float nz=vn(vRest*20.)*.6+vn(vRest*52.)*.4;
float dAmt=clamp(vState.x,0.,1.);

float fm=smoothstep(.12,.55,vState.w+(nz-.5)*.35);

{vec3 q=vRest*furDen;
float dd=min(strand(q,layer),strand(q*1.31+vec3(.5,.27,.81),layer));
float rad=mix(.6,.8,max(wt,dm))*(1.-layer*.82)+.06;

#else
diffuseColor.rgb*=.7;
#endif
vec3 mud=mudCol*(.75+nz*.5);
diffuseColor.rgb*=.94+.12*vn(vRest*90.);
diffuseColor.rgb=mix(diffuseColor.rgb,mud,dm*.92);
diffuseColor.rgb=mix(diffuseColor.rgb,mud*1.35+.03,lm*(1.-fm)*.55);

      .replace('#include <roughnessmap_fragment>',`#include <roughnessmap_fragment>
roughnessFactor=mix(roughnessFactor,.3,wt*.85);roughnessFactor=mix(roughnessFactor,1.,dm*.4);`)
      .replace('#include <lights_physical_fragment>',`#include <lights_physical_fragment>
#ifdef USE_SHEEN
material.sheenColor*=(1.-wt*.75)*(1.-dm*.7);
#endif`);
  };
  m.customProgramCacheKey=()=>shell?'dogfur-shell':'dogfur';
  return m;
}
// 꼭짓점마다 가까운 칸 4개의 가중치를 미리 구해 두고, 매 프레임 칸 상태를 섞어 aState에 씀
function computeWeights(d,cells){
  const sig2=FU.cellSig.value**2,v=V3(),bi=[0,0,0,0],bd=[0,0,0,0];
  for(const m of d.fur){
    const rp=m.geometry.attributes.restPos,n=rp.count,idx=new Int16Array(n*4),w=new Float32Array(n*4);
    for(let i=0;i<n;i++){
      v.fromBufferAttribute(rp,i);bd.fill(1e9);bi.fill(0);
      for(let c=0;c<cells.length;c++){const p=cells[c].p,dx=p.x-v.x,dy=p.y-v.y,dz=p.z-v.z,dd=dx*dx+dy*dy+dz*dz;
        if(dd<bd[3]){let k=3;while(k>0&&bd[k-1]>dd){bd[k]=bd[k-1];bi[k]=bi[k-1];k--}bd[k]=dd;bi[k]=c}}
      let sum=0;for(let k=0;k<4;k++){const x=bd[k]<1e8?Math.exp(-bd[k]/sig2):0;w[i*4+k]=x;idx[i*4+k]=bi[k];sum+=x}
      if(sum<1e-6){w[i*4]=1;sum=1}
      for(let k=0;k<4;k++)w[i*4+k]/=sum;
    }
    m.userData.idx=idx;m.userData.w=w;
  }

const CS=new Float32Array(MAXC*4),CS0=new Float32Array(MAXC*4);
function updateStates(){
  cells.forEach((c,i)=>{CS[i*4]=c.dirt;CS[i*4+1]=c.loose;CS[i*4+2]=c.wet;CS[i*4+3]=c.foam});
  let same=true;for(let i=0;i<cells.length*4;i++)if(CS[i]!==CS0[i]){same=false;break}
  if(same)return;CS0.set(CS);
  for(const m of D.fur){
    const a=m.geometry.attributes.aState,arr=a.array,{idx,w}=m.userData;if(!idx)continue;
    for(let i=0,n=arr.length;i<n;i+=4){
      let x=0,y=0,z=0,q=0;
      for(let k=0;k<4;k++){const wk=w[i+k];if(!wk)continue;const c=idx[i+k]*4;x+=wk*CS[c];y+=wk*CS[c+1];z+=wk*CS[c+2];q+=wk*CS[c+3]}
      arr[i]=x;arr[i+1]=y;arr[i+2]=z;arr[i+3]=q;
    }
    a.needsUpdate=true;
  }
}

function genCells(d){
  const sph=d.fur.filter(m=>m.userData.sph).map(m=>({m,inv:m.userData.rest.clone().invert()}));
  const cand=[],v=V3(),q=V3();
  for(const m of d.fur){
    const rp=m.geometry.attributes.restPos;
    for(let i=0;i<rp.count;i+=2){
      v.fromBufferAttribute(rp,i);if(v.y<.06)continue;
      let inside=false;
      for(const s of sph){if(s.m===m)continue;q.copy(v).applyMatrix4(s.inv);if(q.lengthSq()<.96){inside=true;break}}
      if(!inside)cand.push({p:v.clone(),m});
    }
  }
  const r=rng(11);for(let i=cand.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]]}
  let minD=.085,out=[];
  for(let tries=0;tries<8;tries++){
    out=[];const m2=minD*minD;
    for(const c of cand){let ok=true;for(const o of out)if(o.p.distanceToSquared(c.p)<m2){ok=false;break}
      if(ok){out.push(c);if(out.length>MAXC)break}}
    if(out.length<=MAXC)break;minD*=1.1;
  }
  FU.cellSig.value=minD*.85;
  return out.map(c=>({p:c.p,zone:d.zoneOf(c.m.userData.tag,c.p),vis:true,dirt:0,d0:0,loose:0,foam:0,wet:0}));
}
const ray=new THREE.Raycaster();
function computeVis(){
  const w=V3(),dir=V3(),tol=.05*D.root.scale.x;
  for(const c of cells){
    w.copy(c.p).applyMatrix4(D.root.matrixWorld);dir.subVectors(w,camera.position);const dist=dir.length();dir.normalize();
    ray.set(camera.position,dir);ray.far=dist+.2;
    const hs=ray.intersectObjects(D.pick,false);
    c.vis=hs.length>0&&hs[0].distance>dist-tol;
  }
  ray.far=Infinity;
}

const _a=V3(),_b=V3(),_cc=V3(),_lp=V3(),_bc=V3(),_ra=V3(),_rb=V3(),_rc=V3();

function pick(){

  const hs=ray.intersectObjects(D.pick,false);if(!hs.length)return null;
  const x=hs[0],m=x.object;
  const n=x.face.normal.clone().applyMatrix3(_nm.getNormalMatrix(m.matrixWorld)).normalize();
  let rest=null;const rp=m.geometry.attributes.restPos;

  let inHead=false;for(let o=m;o;o=o.parent)if(o===D.head){inHead=true;break}

const _p1=V3(),_p2=V3(),_dw=V3();

  _p1.copy(h.point).project(camera);_p2.copy(h.point).addScaledVector(_dw,.15).project(camera);
  const sx=(_p2.x-_p1.x)*500,sy=-(_p2.y-_p1.y)*350,len=Math.hypot(sx,sy),ml=Math.hypot(mx,my);

// ---------- 갱신 ----------
function update(dt){
  t+=dt;
  const mx=P.dx,my=P.dy;P.dx=P.dy=0;
  const dist=Math.hypot(mx,my),speed=dist/dt;P.speed+=(speed-P.speed)*Math.min(1,dt*10);
  const moving=dist>.3,active=P.pressing&&P.inside;
  const hit=P.inside?pick():null,h=active?hit:null;
  S.zone=h&&h.zone;S.fast=false;S.grain=1;S.useMsg=null;

  if(active&&(moving||tool==='shower')){
    S.idle=0;
    if(!S.started){S.started=true;hintEl.classList.add('gone')}
    if(h)applyTool(dt,moving,speed,h);
  }else S.idle+=dt;

  // 기분
  if(h&&moving){
    if(tool==='hand')S.grain=grainAt(h,mx,my);
    if(tool==='hand'||tool==='scratch'||tool==='towel'||tool==='foam'){
      const q=smooth(30,220,speed)*(1-smooth(1500,2800,speed));
      let mul=tool==='towel'?.55:tool==='foam'?.3:tool==='scratch'?1.1:1;
      if(tool==='hand'&&S.grain<-.35){mul*=.25;S.annoy+=.28*dt*clamp(speed/400,0,1.5)}
      if(speed>2200){S.fast=true;S.annoy+=.7*dt}
      if(h.zone===B.fav)mul*=1.9;
      if(tool==='scratch'){if(['back','rump','side','neck','head','cheeks'].includes(h.zone))mul*=1.4;if(h.zone==='muzzle'){mul*=.3;S.annoy+=.3*dt}}
      if(h.zone==='muzzle')mul*=.5;
      if(h.zone==='paws')mul*=.5;
      if(h.zone==='tail'){mul=0;S.annoy+=.5*dt}
      S.h+=q*mul*.16*dt*(1-S.h*.45);
      if(h.zone===B.fav&&q>.4&&tool!=='towel'){
        S.favTime+=dt;
        if(!S.found&&S.favTime>1.2){S.found=true;sfx.whine();for(let i=0;i<9;i++)heart(true)}
      }
      S.heartClock+=dt*q*(1+2*S.h)*mul;
      if(S.heartClock>.55){S.heartClock=0;heart(false,h.point)}
    }
  }
  if(h&&tool==='shower'&&['head','muzzle','ears','cheeks'].includes(h.zone)){S.annoy+=.45*dt;S.useMsg='face'}
  if(h&&tool==='foam'&&h.zone==='muzzle'&&moving&&S.sneeze<=0&&Math.random()<dt*1.5){
    S.sneeze=.6;sfx.sneeze();S.annoy+=.2;
    const np=noseWorld(),fw=V3(0,0,1).transformDirection(D.head.matrixWorld);
    for(let i=0;i<12;i++)spawnBubble(np,fw.clone().multiplyScalar(.6+Math.random()*.5).add(V3((Math.random()-.5)*.4,Math.random()*.3,(Math.random()-.5)*.4)));
  }
  // 씻겨 나간 만큼 개운해서 기분이 좋아짐
  const prevClean=S.cleanPrev??S.clean;
  if(h&&(moving||tool==='shower'))S.h+=Math.max(0,S.clean-prevClean)*1.6*(1-S.h*.4);
  if(h&&tool==='shower'&&!S.useMsg)S.h+=.02*dt;
  if(!(h&&moving&&tool!=='shower')&&!(h&&tool==='shower'))S.h-=(active?.008:.02)*dt;
  if(S.done)S.h=Math.max(S.h,.55);
  S.h=clamp(S.h,0,1);
  S.annoy=Math.max(0,S.annoy-.35*dt);
  if(S.annoy>.7&&S.shake<=0){S.shake=.7;S.h=Math.max(0,S.h-.12);S.annoy=.3}

  // 칸: 물기 마르기, 청결도
  let dsum=0,wsum=0,n=0;
  for(const c of cells){if(!c.vis)continue;c.wet=Math.max(0,c.wet-dt*.006);dsum+=Math.min(1,c.dirt+c.loose*.6);wsum+=c.wet;n++}
  S.cleanPrev=S.clean;S.clean=n?clamp(1-dsum/n,0,1):1;S.wet=n?wsum/n:0;
  if(!S.done&&S.clean>.95&&S.wet<.08){S.done=true;sfx.whine();for(let i=0;i<24;i++)sparkle()}

  // 물기 털기
  S.shakeCool=Math.max(0,S.shakeCool-dt);
  if(S.wet>.3&&S.idle>2&&S.shakeOff<=0&&S.shakeCool<=0&&tool!=='shower'){
    S.shakeOff=1.3;S.shakeCool=6;
    for(const c of cells)c.wet*=.45;
    for(let i=0;i<90;i++)fling();
  }
  let env=0;
  if(S.shakeOff>0){S.shakeOff-=dt;env=Math.sin(Math.PI*clamp(1-S.shakeOff/1.3,0,1))}
  const rm=reduce.matches?0:1;
  D.root.rotation.z=Math.sin(t*32)*.1*env*rm;
  D.root.rotation.y=DOG_ROT+Math.sin(t*30+1)*.05*env*rm;

  // 머리: 손 쪽을 바라봄
  let yawT=.38+Math.sin(t*.5)*.05,pitchT=Math.sin(t*.37)*.03;
  const target=hit?hit.point:planePoint();
  if(P.inside&&target){
    const q=D.root.worldToLocal(target.clone());
    const hx=q.x,hy=q.y-.88,hz=q.z-(.66*B.len);
    yawT+=clamp(hx*1.1,-.5,.5)*(hit&&hit.inHead?.5:1);
    pitchT+=clamp(-hy*.5,-.2,.3)*(hz<0?.5:1);
  }
  if(S.shake>0){S.shake-=dt;yawT+=Math.sin(t*38)*.3*smooth(0,.25,S.shake)*rm}
  yawT+=Math.sin(t*30+1)*.4*env*rm;
  const prevYaw=S.yaw;
  const kk=Math.min(1,dt*(S.shake>0||env>0?20:3.5));
  S.yaw+=(yawT-S.yaw)*kk;S.pitch+=(pitchT-S.pitch)*kk;
  const headVel=(S.yaw-prevYaw)/dt;
  S.sneeze=Math.max(0,S.sneeze-dt);
  const nod=S.sneeze>0?.4*Math.sin(Math.PI*S.sneeze/.6):0;
  D.headPivot.rotation.set(S.pitch+nod,S.yaw,Math.sin(t*.8)*.1*S.h);
  S.pant+=((S.h>.42&&S.shakeOff<=0?1:0)-S.pant)*Math.min(1,dt*2);
  S.pantPhase+=TAU*(2.4+2*S.h)*dt;
  D.tongue.visible=S.pant>.15;
  if(D.tongue.visible){const k=S.pant;D.tongue.position.set(0,-.14-.035*k+.006*Math.sin(S.pantPhase),D.tongueZ+.03*k);D.tongue.scale.set(.05,.018,.06+.035*k)}

  // 귀
  const flat=S.shake>0||S.annoy>.4||S.useMsg==='face';
  for(const e of D.ears){
    const rest=e.drape?(flat?-.25:S.h*.15):(flat?-.7:-.05+S.h*.08);
    const k=e.drape?40:140;
    let acc=-k*(e.a-rest)-(e.drape?5:14)*e.v-headVel*(e.drape?6:2)+env*Math.sin(t*32)*60*rm;
    if(hit&&active&&hit.zone==='ears'&&moving)acc+=my*.3+mx*e.sx*.2;
    e.v+=acc*dt;e.a=clamp(e.a+e.v*dt,-1,1);
    if(e.drape){e.piv.rotation.x=e.a*.5;e.piv.rotation.z=e.sx*(.18+Math.max(0,-e.a)*.1+(e.a)*.2)}
    else e.piv.rotation.x=e.a;
  }

  // 꼬리
  const T=B.tail;
  const amp=(.12+.6*S.h)*(1-smooth(.3,.7,S.annoy))*(reduce.matches?.5:1);
  const freq=1.1+5.6*S.h,prevSin=Math.sin(S.wagPhase);
  S.wagPhase+=TAU*freq*dt;const sn=Math.sin(S.wagPhase);
  if(prevSin>0&&sn<=0&&S.h>.55&&T.type==='floor')sfx.thump();
  if(T.type==='over')D.tailPivot.rotation.set(0,0,amp*sn*.55);
  else if(T.type==='floor')D.tailPivot.rotation.set(0,amp*sn*.8-(S.annoy>.4?.3:0),0);
  else D.tailPivot.rotation.set(0,amp*sn*.9,0);
  D.tail.forEach((s,i)=>{s.g.rotation.y=s.ry+(i?amp*.22*Math.sin(S.wagPhase-i*.55):0)});

  // 뒷다리 차기, 숨쉬기, 눈
  const kickOn=active&&((S.zone===B.fav&&S.found&&S.h>.5)||(tool==='scratch'&&['rump','side','back'].includes(S.zone)&&S.h>.4));
  S.kick+=((kickOn?1:0)-S.kick)*Math.min(1,dt*6);
  D.kick.rotation.set(-S.kick*(.3+.3*Math.sin(t*24)),0,S.kick*.25*(.5+.5*Math.sin(t*24+.6)));
  D.torso.scale.y=D.torsoSY*(1+.025*Math.sin(t*(2.2+S.pant*7)));
  S.nextBlink-=dt;if(S.nextBlink<0){S.blink=.14;S.nextBlink=2+Math.random()*3.5}
  S.blink=Math.max(0,S.blink-dt);
  const happy=S.h>.65&&active&&h&&moving&&(tool==='hand'||tool==='scratch');
  for(const e of D.eyes)e.m.scale.y=e.s*(S.blink>0?.12:happy?.3:1);

  updateParticles(dt);
  updateFoam();
  updateStates();
  updateTool(dt,hit,moving);

  // 소리
  const s1=Math.sin(S.pantPhase);
  sfx.set('pant',S.pant*.35*(s1>0?s1*s1:.35*s1*s1),s1>0?1500:950);
  sfx.set('shower',active&&tool==='shower'?.22:0);
  sfx.set('scratch',h&&tool==='scratch'&&moving?clamp(P.speed/700,0,1)*.4:0);
  sfx.set('rub',h&&moving&&(tool==='towel'||tool==='foam')?clamp(P.speed/600,0,1)*.5:0);
  updateUI();
}

function applyTool(dt,moving,speed,h){
  const R=RADIUS[tool],R2=R*R,sp=clamp(speed/300,.3,1.6);
  for(const c of cells){
    if(!c.vis)continue;
    const d2=c.p.distanceToSquared(h.rest);if(d2>R2)continue;
    const f=1-Math.sqrt(d2)/R;
    if(tool==='foam'){
      c.foam=Math.min(1,c.foam+f*dt*(moving?3.2:.8));
      if(moving){const tr=Math.min(c.dirt,c.foam*f*dt*3.6*sp);c.dirt-=tr;c.loose+=tr}
      c.wet=Math.max(c.wet,.25*c.foam);
    }else if(tool==='hand'||tool==='scratch'){
      if(moving&&c.foam>.05){const tr=Math.min(c.dirt,c.foam*f*dt*(tool==='hand'?2.6:2)*sp);c.dirt-=tr;c.loose+=tr}
    }else if(tool==='shower'){
      const r=f*dt*2.6;
      if(c.loose>.08&&Math.random()<r*4)muddy(c);
      c.loose*=Math.exp(-r*1.8);c.foam*=Math.exp(-r*2);
      if(c.foam<.12)c.dirt=Math.max(0,c.dirt-r*(c.dirt<.2?.6:.3));
      c.wet=Math.min(1,c.wet+r*1.3);
    }else if(tool==='towel'){
      c.wet=Math.max(0,c.wet-f*dt*(moving?1.5:.3)*sp);
      if(c.foam>0)c.foam*=Math.exp(-f*dt*.8);
    }
  }
  if(tool==='foam'&&moving&&h.carrier){
    S.bubbleClock+=dt*clamp(speed/250,0,2);
    if(S.bubbleClock>.04){S.bubbleClock=0;
      for(let k=0;k<2;k++){
        const tan=V3().randomDirection();tan.addScaledVector(h.normal,-tan.dot(h.normal)).multiplyScalar(.07*D.root.scale.x);
        const wp=h.point.clone().addScaledVector(h.normal,.012).add(tan);
        const L=h.carrier.list;if(L.length>=240)L.shift();
        L.push({pos:h.carrier.group.worldToLocal(wp),r:.016+Math.random()*.03,cell:nearestCell(h.rest),seed:Math.random()*9});
      }
    }
    if(Math.random()<dt*3)spawnBubble(h.point);
  }
}

// 도구: 닿은 표면에 맞춰 눕힘
const _tp=V3(),_tq=new THREE.Quaternion(),_bx=V3(),_by=V3(),_bz=V3(),_bm=new THREE.Matrix4(),_np=V3();
let toolInit=false;
function updateTool(dt,hit,moving){
  for(const k in TOOLS)TOOLS[k].visible=k===tool&&P.inside;
  if(!P.inside){toolInit=false;return}
  let p,n;
  if(hit){p=hit.point;n=hit.normal}else{p=planePoint();n=UP;if(!p){TOOLS[tool].visible=false;return}}
  _by.copy(_np.copy(n).addScaledVector(UP,tool==='shower'?1:tool==='scratch'?0:.6).normalize());
  _bz.subVectors(camera.position,p);_bz.addScaledVector(_by,-_bz.dot(_by)).normalize();
  _bx.crossVectors(_by,_bz);
  _bm.makeBasis(_bx,_by,_bz);_tq.setFromRotationMatrix(_bm);
  const lift=(P.pressing?0:.07)+(tool==='shower'?.05:0);
  _tp.copy(p).addScaledVector(_by,lift+.004);
  if(!toolInit){toolRoot.position.copy(_tp);toolRoot.quaternion.copy(_tq);toolInit=true}
  toolRoot.position.lerp(_tp,1-Math.exp(-dt*28));toolRoot.quaternion.slerp(_tq,1-Math.exp(-dt*14));
  const g=TOOLS[tool];
  if(tool==='hand'){const w=moving&&P.pressing?Math.sin(t*14):0;g.userData.fingers.forEach((f,i)=>{f.rotation.x=-.15+.12*w*Math.sin(i)})}
  if(tool==='scratch')g.rotation.y=moving&&P.pressing?Math.sin(t*34)*.08:0;
  if(tool==='shower'&&P.pressing){
    const nz=g.userData.nozzle.getWorldPosition(V3());
    for(let i=0;i<6;i++){
      const o=V3((Math.random()-.5)*.1,0,(Math.random()-.5)*.1).applyQuaternion(toolRoot.quaternion);
      const from=nz.clone().add(o),v=V3().subVectors(p,from);const d=v.length();v.normalize().multiplyScalar(3.2).add(V3((Math.random()-.5)*.25,0,(Math.random()-.5)*.25));
      spawnDrop(from,v,d/3.2,.012+Math.random()*.008);
    }
  }
}

// ---------- 문구 ----------
const moodBar=document.getElementById('moodBar'),moodVal=document.getElementById('moodVal');
const cleanBar=document.getElementById('cleanBar'),cleanVal=document.getElementById('cleanVal');
let lastMsg='',msgAt=-9;
function updateUI(){
  moodBar.style.width=(S.h*100).toFixed(1)+'%';
  moodVal.textContent=S.h<.25?'시큰둥':S.h<.5?'편안':S.h<.75?'신남':'황홀';
  cleanBar.style.width=(S.clean*100).toFixed(1)+'%';
  cleanVal.textContent=Math.round(S.clean*100)+'%'+(S.wet>.12?` · 물기 ${Math.round(S.wet*100)}%`:'');
  const foamy=cells.some(c=>c.foam>.25);
  let m;
  if(S.shakeOff>0)m='부르르르! 몸을 털어 물기를 날려요.';
  else if(S.sneeze>0)m='에취! 코에 거품이 들어갔어요.';
  else if(S.useMsg==='face')m='얼굴에 물은 싫어요! 몸에 뿌려 주세요.';
  else if(S.shake>0)m='앗, 싫어요! 고개를 홱 돌려요.';
  else if(S.zone==='tail')m='꼬리는 만지지 말아 주세요.';
  else if(S.fast)m='너무 세요. 천천히 해 주세요.';
  else if(S.zone&&tool==='hand'&&S.grain<-.35)m='털 결 반대 방향이에요. 꼬리 쪽으로 쓸어 주세요.';
  else if(S.kick>.5)m='바로 거기! 뒷다리가 저절로 움직여요.';
  else if(S.zone&&tool==='scratch')m=S.h>.6?'으아~ 시원해! 눈을 지그시 감아요.':'시원해요. 긁긁긁.';
  else if(S.zone&&tool==='foam')m=S.clean<.6?'거품으로 문지르니 흙이 녹아 나와요.':'뽀득뽀득 거품이 가득해요.';
  else if(P.pressing&&tool==='shower')m=foamy?'거품과 흙탕물이 씻겨 내려가요.':S.clean<.75?'물로만은 흙이 잘 안 빠져요. 거품을 먼저 묻혀 주세요.':'시원하게 헹구는 중이에요.';
  else if(S.zone&&tool==='towel')m=S.wet>.1?'수건으로 보송보송 말리는 중이에요.':'뽀송뽀송해요.';
  else if(S.done&&S.h>.75)m=`깨끗해진 ${B.subj} 꼬리를 신나게 흔들어요.`;
  else if(S.done)m='보송보송 깨끗해졌어요! 이제 실컷 쓰다듬어 주세요.';
  else if(foamy)m='거품을 샤워기로 헹궈 주세요.';
  else if(S.wet>.15)m='수건으로 닦아 주세요. 가만두면 몸을 털어요.';
  else if(S.clean<.7)m='산책하다 진흙투성이가 됐어요. 거품을 묻혀 문질러 주세요.';
  else if(S.h>.45)m='기분이 좋아서 헥헥거려요.';
  else m=`${B.subj} 쳐다보고 있어요.`;
  if(S.found&&S.zone===B.fav&&S.kick<.5&&tool==='hand'&&!S.fast&&S.grain>=-.35)m=`${ZONES[B.fav]}! ${B.subj} 제일 좋아하는 곳이에요.`;
  if(m!==lastMsg&&t-msgAt>.6){lastMsg=m;msgAt=t;msgEl.textContent=m}
}

// ---------- 견종 버튼 그림 (머리 3D 미리보기) ----------
function makeThumbs(){
  const out={};
  const r2=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
  r2.setPixelRatio(1);r2.setSize(120,120,false);r2.toneMapping=THREE.ACESFilmicToneMapping;
  const sc=new THREE.Scene(),pm=new THREE.PMREMGenerator(r2);
  sc.environment=pm.fromScene(new RoomEnvironment(),.04).texture;sc.environmentIntensity=.55;
  sc.background=new THREE.Color('#efe5d8');
  sc.add(new THREE.HemisphereLight('#fff6ea','#b48a64',1));
  const k=new THREE.DirectionalLight('#fff0dc',2.4);k.position.set(-1.5,2,2.5);sc.add(k);
  const cam=new THREE.PerspectiveCamera(30,1,.05,20);
  const saved=[FU.furLen.value,FU.furDen.value];
  for(const[key,b]of Object.entries(BREEDS)){
    FU.furLen.value=b.fur;FU.furDen.value=b.furDen;
    const d=makeDog(b);d.root.rotation.y=-.4;sc.add(d.root);d.root.updateMatrixWorld(true);
    const c=V3();d.head.getWorldPosition(c);c.y+=.05*b.head*(b.ears.kind==='erect'?b.ears.size*.6:0)+.02;
    const dir=V3(.25,.12,1).normalize();
    cam.position.copy(c).addScaledVector(dir,1.25*b.head*(1+Math.max(0,b.ears.size-1)*.35));cam.lookAt(c);
    r2.render(sc,cam);out[key]=r2.domElement.toDataURL();sc.remove(d.root);disposeDog(d);
  }
  [FU.furLen.value,FU.furDen.value]=saved;
  pm.dispose();r2.dispose();r2.forceContextLoss();
  return out;
}

// ---------- 크기 ----------
function resize(){
  const r=cv.getBoundingClientRect(),w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
  renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w/h<1.2?36:30;camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(cv);

// ---------- 버튼 ----------
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const breedsEl=document.getElementById('breeds');
let thumbs={};
try{thumbs=makeThumbs()}catch{}
for(const[key,b]of Object.entries(BREEDS)){
  const btn=document.createElement('button');btn.className='swatch';btn.dataset.breed=key;
  btn.setAttribute('aria-pressed','false');btn.setAttribute('aria-label',b.name);btn.title=b.name;
  btn.style.backgroundImage=thumbs[key]?`url(${thumbs[key]})`:`radial-gradient(circle at 35% 35%,${b.mark},${b.base} 60%)`;
  btn.addEventListener('click',()=>selectBreed(key));
  breedsEl.append(btn);
}
function selectBreed(key){
  buildDog(key);
  for(const b of breedsEl.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.dataset.breed===key));
  store.set('dog-petting-breed',key);lastMsg='';msgAt=-9;
}
function selectTool(k){
  tool=k;for(const b of document.querySelectorAll('[data-tool]'))b.setAttribute('aria-pressed',String(b.dataset.tool===k));
  store.set('dog-petting-tool',k);toolInit=false;
}
const lightBtn=document.getElementById('lightToggle');
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const MOON='<svg viewBox="0 0 24 24"><path d="M19.5 15.5A8.7 8.7 0 0 1 8.5 4.3a8.5 8.5 0 1 0 11 11.2Z"/></svg>';
function selectLight(k){
  light=k;lightBtn.innerHTML=k==='day'?MOON:SUN;lightBtn.setAttribute('aria-label',k==='day'?'밤으로 바꾸기':'낮으로 바꾸기');
  store.set('dog-petting-light',k);
}
lightBtn.addEventListener('click',()=>selectLight(light==='day'?'night':'day'));
document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>selectTool(b.dataset.tool)));
document.getElementById('walk').addEventListener('click',()=>dirty());
const soundBtn=document.getElementById('sound');
soundBtn.addEventListener('click',async()=>{
  try{const on=await sfx.toggle();soundBtn.setAttribute('aria-pressed',String(on));soundBtn.setAttribute('aria-label',on?'소리 끄기':'소리 켜기')}
  catch{soundBtn.disabled=true;soundBtn.setAttribute('aria-label','소리를 쓸 수 없어요')}
});
const stage=document.getElementById('stage');
document.getElementById('full').addEventListener('click',async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen()}catch{}
});

buildRoom();buildTools();resize();
// 손: WebXR 입력 프로필의 generic-hand 모델(MIT, Amazon). 불러오기 전/실패 시에는 도형 손을 그대로 씀
new GLTFLoader().load('https://cdn.jsdelivr.net/npm/@webxr-input-profiles/assets@1.0.19/dist/profiles/generic-hand/right.glb',gl=>{
  const g=TOOLS.hand;
  const skin=new THREE.MeshPhysicalMaterial({color:'#f6cbb0',roughness:.48,sheen:.6,sheenRoughness:.5,sheenColor:new THREE.Color('#ffd9cc'),clearcoat:.12});
  gl.scene.traverse(o=>{if(o.isMesh){o.material=skin;o.castShadow=true;o.frustumCulled=false}});
  // 모델은 손가락이 -y, 손바닥이 -x. 도구 좌표에서는 손가락이 -x(화면 왼쪽), 손바닥이 아래(-y)
  const holder=new THREE.Group();
  holder.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(V3(0,1,0),V3(1,0,0),V3(0,0,-1)));
  holder.add(gl.scene);
  const wrap=new THREE.Group();wrap.add(holder);wrap.scale.setScalar(1.9);wrap.position.set(.1,.04,0);wrap.rotation.z=.12;
  const sleeve=new THREE.MeshPhysicalMaterial({color:'#8fb3d6',roughness:.95,sheen:1,sheenColor:new THREE.Color('#e2eeff')});
  const sl=new THREE.Mesh(new THREE.CylinderGeometry(.068,.08,.3,28),sleeve);sl.position.set(.41,.13,0);sl.rotation.z=-1.11;sl.castShadow=true;
  const cuff=new THREE.Mesh(new THREE.TorusGeometry(.064,.02,12,30),sleeve);cuff.position.set(.27,.07,0);cuff.rotation.set(0,Math.PI/2,-1.11+Math.PI/2);
  g.userData.hg.visible=false;g.userData.fingers=[];g.add(wrap,sl,cuff);
},undefined,()=>{});
const savedBreed=store.get('dog-petting-breed');
selectBreed(BREEDS[savedBreed]?savedBreed:'shiba');
const savedTool=store.get('dog-petting-tool');selectTool(RADIUS[savedTool]?savedTool:'hand');
const savedLight=store.get('dog-petting-light');
selectLight(savedLight==='day'||savedLight==='night'?savedLight:(matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'));
msgEl.textContent='산책하고 왔어요.';

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(.001,(now-last)/1000));last=now;
  update(dt);
  const target=light==='night'?1:0;
  const nm=lightMix<0?target:lightMix+(target-lightMix)*Math.min(1,dt*4);
  if(Math.abs(nm-lightMix)>1e-4){lightMix=Math.abs(nm-target)<1e-3?target:nm;applyLight(lightMix)}
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
